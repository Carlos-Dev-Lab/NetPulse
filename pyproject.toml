[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "1.1.0"
description = "Real-time network analyzer for Windows: passive capture, per-application traffic, asset inventory and Nmap analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Carlos Coronel" }]
keywords = ["network", "analyzer", "scapy", "nmap", "flet", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "flet==0.85.3",
    "flet-desktop==0.85.3",
    "scapy>=2.5.0",
    "psutil>=5.9.0",
    "reportlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Carlos-Dev-Lab/NetPulse"
Issues = "https://github.com/Carlos-Dev-Lab/NetPulse/issues"

[project.scripts]
netpulse = "netpulse.__main__:run"

[tool.setuptools.packages.find]
include = ["netpulse*"]
